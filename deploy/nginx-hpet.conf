# HPet - nginx HTTPS 리버스 프록시 설정 (MVP 데모용, AWS Lightsail)
#
# deploy/lightsail-deploy.sh 가 __SERVER_NAME__ 을 서버 공인 IP(또는 도메인)로 바꿔서
# /etc/nginx/conf.d/hpet.conf 로 설치합니다. 이 파일을 직접 복사하지 마세요.
#
# 구성:
#   - 443: 자체서명 인증서로 HTTPS, frontend 정적 파일, /api·/files → 백엔드(8080)
#   - 80 : 443으로 리다이렉트
#   - 웹캠/기기 센서 권한은 HTTPS(secure context)에서만 동작하므로 HTTPS가 필요합니다.
#     도메인을 연결하면 Let's Encrypt 정식 인증서로 교체하세요.

server {
    listen 80;
    server_name __SERVER_NAME__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    client_max_body_size 20M;

    root /var/www/hpet;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 업로드한 인증 사진 (백엔드가 ./uploads 를 /files/** 로 서빙)
    location /files/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
    }
}

# HPet - nginx HTTPS 리버스 프록시 설정 (해커톤 데모용)
#
# 이 파일은 문서화 목적의 참고용 사본입니다. 실제 서버에서 적용되는 파일은
# /etc/nginx/conf.d/hpet.conf 이며, 아래 setup-https-selfsigned.sh 스크립트가
# 이 파일을 그대로 /etc/nginx/conf.d/hpet.conf 로 복사(또는 심볼릭 링크)합니다.
#
# 구성:
#   - 443: 자체서명 인증서로 HTTPS 처리, frontend 정적 파일 서빙, /api → 백엔드(8080) 프록시
#   - 80 : 443으로 리다이렉트
#
# 인증서: 자체서명, 유효기간 30일 (해커톤 기간 임시용)
#   - 도메인 없이 IP만으로 자세교정 기능의 DeviceOrientationEvent 권한 요청에 필요한
#     HTTPS(secure context) 조건을 충족시키기 위한 임시 조치입니다.
#   - 이후 도메인을 구입하면 Let's Encrypt 정식 인증서로 교체해야 합니다.

server {
    listen 80;
    server_name 1.201.117.185;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 1.201.117.185;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    client_max_body_size 20M;

    root /var/www/hpet;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

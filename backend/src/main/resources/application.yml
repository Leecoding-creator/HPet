server:
  port: 8080

spring:
  application:
    name: hpet-backend
  datasource:
    url: jdbc:h2:mem:hpet;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 데모용 시크릿입니다. 실제 배포 시 반드시 환경변수로 교체하세요.
  secret: change-this-secret-key-for-hackathon-demo-only-please-1234567890
  access-token-expiration-ms: 3600000        # 1시간
  refresh-token-expiration-ms: 1209600000    # 14일

# Phase 5 - AI 비전 인증. API 키는 코드에 직접 쓰지 않는다.
# backend/.env 의 OPENAI_API_KEY 를 spring-dotenv가 프로세스 환경변수처럼 로드해준다.
openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-5.6-sol
  vision-endpoint: https://api.openai.com/v1/chat/completions
  # 팀 피드백: 원본(3~4MB급) 그대로 보내면 토큰이 9천~1만 정도 소모됨.
  # 판정 정확도에 지장 없는 선(512~1024px)까지 축소해서 비용/Rate Limit 부담을 줄인다.
  max-image-dimension: 1024
  image-quality: 0.85

# 인증 사진 로컬 저장 경로 (해커톤 스코프 - 실서비스 전환 시 S3로 교체 예정)
storage:
  local:
    root: ./uploads
  public-base-url: /files

spring.servlet.multipart.max-file-size: 10MB
spring.servlet.multipart.max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health